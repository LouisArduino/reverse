<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reverse Audio</title>
<meta name="theme-color" content="#e5484d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reverse Audio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo-reverse-audio.svg">
<link rel="icon" type="image/x-icon" href="logo-reverse-audio.svg">
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#e5484d;--btn:#1d1d1f;--btn-text:#fff;--line:#d2d2d7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--card:#2c2c2e;--text:#f5f5f7;--muted:#a1a1a6;--accent:#ff6b6b;--btn:#f5f5f7;--btn-text:#1c1c1e;--line:#48484a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1c1e;--card:#2c2c2e;--text:#f5f5f7;--muted:#a1a1a6;--accent:#ff6b6b;--btn:#f5f5f7;--btn-text:#1c1c1e;--line:#48484a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.logo{width:72px;height:72px;display:block;margin:0 auto 12px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
#rec{width:110px;height:110px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
#rec.on{animation:pulse 1s infinite}
#rec:disabled{opacity:.4;cursor:default}
@keyframes pulse{50%{transform:scale(1.08)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
button.b,label.b{padding:12px 18px;border-radius:12px;border:none;background:var(--btn);color:var(--btn-text);font-weight:600;cursor:pointer;font-size:.95rem;display:inline-block}
button.b:disabled{opacity:.35;cursor:default}
.alt{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.alt label.b{margin-top:10px}
#file{display:none}
#status{min-height:1.4em;margin-top:18px;color:var(--muted);font-size:.9rem;line-height:1.4}
/* Ouvert depuis l'écran d'accueil (iPhone ou Android) : pas de barre du navigateur, on évite le chevauchement avec la barre du bas */
@media (display-mode: standalone), (display-mode: fullscreen) {
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
}
</style>
</head>
<body>
<main>
  <h1>Reverse Audio</h1>
  <p class="sub">Enregistrez, inversez, écoutez.</p>
  <button id="rec">Enregistrer</button>
  <div class="row">
    <button class="b" id="playRev" disabled>Écouter à l'envers</button>
    <button class="b" id="playOrig" disabled>Écouter l'original</button>
  </div>
  <div class="alt">
    Le micro ne fonctionne pas dans cette fenêtre ? Enregistrez avec l'application Dictaphone de votre appareil, puis importez le fichier ici.
    <br>
    <label class="b" for="file">Importer un fichier audio</label>
    <input type="file" id="file" accept="audio/*">
  </div>
  <div id="status">Appuyez sur Enregistrer pour commencer.</div>
</main>
<script>
const recBtn = document.getElementById('rec');
const playRevBtn = document.getElementById('playRev');
const playOrigBtn = document.getElementById('playOrig');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');

let audioCtx = null;
let recorder = null;
let stream = null;
let chunks = [];
let originalBuffer = null;
let reversedBuffer = null;
let currentSource = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function setStatus(msg) { statusEl.textContent = msg; }

function reverseBuffer(buf) {
  const out = getCtx().createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const src = buf.getChannelData(c);
    const dst = out.getChannelData(c);
    const n = src.length;
    for (let i = 0; i < n; i++) dst[i] = src[n - 1 - i];
  }
  return out;
}

async function loadBlob(blob) {
  setStatus('Traitement…');
  try {
    originalBuffer = await getCtx().decodeAudioData(await blob.arrayBuffer());
    reversedBuffer = reverseBuffer(originalBuffer);
    playRevBtn.disabled = false;
    playOrigBtn.disabled = false;
    setStatus('Prêt. Cliquez sur « Écouter à l\'envers ».');
  } catch (err) {
    setStatus('Impossible de lire ce fichier audio. Essayez un autre format (MP3, WAV, M4A).');
  }
}

function play(buffer, label) {
  const ctx = getCtx();
  ctx.resume();
  if (currentSource) { try { currentSource.stop(); } catch (e) {} }
  currentSource = ctx.createBufferSource();
  currentSource.buffer = buffer;
  currentSource.connect(ctx.destination);
  currentSource.onended = () => setStatus('Terminé.');
  currentSource.start();
  setStatus(label);
}

function micErrorMessage(err) {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    return "Le micro n'est pas accessible dans cette fenêtre. Utilisez le bouton « Importer un fichier audio » ci-dessous.";
  }
  switch (err && err.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return "L'accès au micro est bloqué par la fenêtre ou le navigateur. Utilisez « Importer un fichier audio » ci-dessous.";
    case 'NotFoundError':
    case 'OverconstrainedError':
      return "Aucun micro détecté sur cet appareil.";
    case 'NotReadableError':
      return "Le micro est déjà utilisé par une autre application. Fermez-la et réessayez.";
    default:
      return "Le micro n'a pas pu démarrer (" + (err && err.name ? err.name : 'erreur inconnue') + "). Utilisez « Importer un fichier audio ».";
  }
}

recBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  getCtx();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus(micErrorMessage(err));
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recBtn.classList.remove('on');
    recBtn.textContent = 'Enregistrer';
    await loadBlob(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
  };
  recorder.start();
  recBtn.classList.add('on');
  recBtn.textContent = 'Arrêter';
  setStatus('Enregistrement en cours…');
});

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  setStatus('Chargement de « ' + file.name + ' »…');
  await loadBlob(file);
  fileInput.value = '';
});

playRevBtn.addEventListener('click', () => {
  if (reversedBuffer) play(reversedBuffer, 'Lecture à l\'envers…');
});

playOrigBtn.addEventListener('click', () => {
  if (originalBuffer) play(originalBuffer, 'Lecture de l\'original…');
});
</script>
</body>
</html>
